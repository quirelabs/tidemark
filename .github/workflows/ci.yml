name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Ubuntu runners ship a running Docker daemon, so testcontainers needs no setup.
      - run: pnpm test
